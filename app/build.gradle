buildscript {
    repositories {
        maven { url 'https://maven.fabric.io/public' }
    }

    dependencies {
        classpath 'io.fabric.tools:gradle:1.21.2'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

repositories {
    maven { url 'https://maven.fabric.io/public' }
    maven { url 'https://zendesk.artifactoryonline.com/zendesk/repo' }
    // For drawing a circular tile with letter inside it, like in contacts
    maven { url 'http://dl.bintray.com/amulyakhare/maven' }
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}


android {
    compileSdkVersion 25
    buildToolsVersion "23.0.3"
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.eventshigh.nearme.app"
        minSdkVersion 19
        targetSdkVersion 23
        versionCode 350
        versionName "3.5.0"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }

        packagingOptions {
            exclude "lib/arm64-v8a/libgnustl_shared.so"
        }
    }
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        jumboMode = true
    }
}

dependencies {
    compile(name: 'volley-release', ext: 'aar')
    compile "com.facebook.react:react-native:+" // From node_modules.
    compile project(':react-native-sensitive-info')
    compile project(':react-native-firestack')
    compile 'com.google.android.gms:play-services-base:10.2.4'
    compile 'com.google.firebase:firebase-appindexing:10.2.4'
    compile 'com.google.android.gms:play-services-location:10.2.4'
    compile 'com.google.android.gms:play-services-maps:10.2.4'
    compile 'com.google.android.gms:play-services-analytics:10.2.4'
    compile 'com.google.android.gms:play-services-gcm:10.2.4'
    compile 'com.google.android.gms:play-services-plus:10.2.4'
    compile 'com.google.android.gms:play-services-places:10.2.4'
    compile 'com.android.support:appcompat-v7:25.1.0'
    compile 'com.android.support:support-v4:25.1.0'
    compile 'com.android.support:cardview-v7:25.1.0'
    compile 'com.android.support:recyclerview-v7:25.1.0'
    compile 'com.android.support:design:25.1.0'
    compile 'com.facebook.android:facebook-android-sdk:4.12.1'
    compile 'it.sephiroth.android.library.imagezoom:imagezoom:2.2.2'
    compile 'com.zendesk:sdk:1.5.1.2'
    compile 'com.amulyakhare:com.amulyakhare.textdrawable:1.0.1'
    compile 'com.splitwise:tokenautocomplete:2.0.1@aar'
    compile 'com.github.bumptech.glide:glide:3.6.1'
    compile 'io.branch.sdk.android:library:1.10.8'
    compile 'com.squareup:android-times-square:1.6.5@aar'
    compile('com.crashlytics.sdk.android:crashlytics:2.5.5@aar') {
        transitive = true;
    }
    compile files('libs/YouTubeAndroidPlayerApi.jar')
    compile files('libs/GoogleConversionTrackingSdk-2.2.4.jar')
    compile 'com.google.android.gms:play-services-auth:10.2.4'

}

apply plugin: 'com.google.gms.google-services'
