buildscript {
    repositories {
        maven { url 'https://maven.fabric.io/public' }
    }

    dependencies {
        classpath 'io.fabric.tools:gradle:1.22.2'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

repositories {
    maven { url 'https://maven.fabric.io/public' }
    maven { url 'https://zendesk.artifactoryonline.com/zendesk/repo' }
    // For drawing a circular tile with letter inside it, like in contacts
    maven { url 'http://dl.bintray.com/amulyakhare/maven' }
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
    google()
}


android {
    compileSdkVersion 27
    buildToolsVersion '26.0.2'
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.eventshigh.nearme.app"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 386
        versionName "3.8.6"
        resConfigs "en"
    }
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
    }

    dexOptions {
        jumboMode = true
    }
}

dependencies {
    compile(name: 'volley-release', ext: 'aar')

    compile 'com.google.android.gms:play-services-base:11.8.0'
    compile 'com.google.android.gms:play-services-location:11.8.0'
    compile 'com.google.android.gms:play-services-places:11.8.0'
    compile 'com.google.android.gms:play-services-maps:11.8.0'
    compile 'com.google.android.gms:play-services-analytics:11.8.0'

    compile 'com.google.android.gms:play-services-plus:11.8.0'
    compile 'com.google.android.gms:play-services-auth:11.8.0'
    compile 'com.google.firebase:firebase-messaging:11.8.0'

    compile 'com.android.support:appcompat-v7:27.1.0'
    compile 'com.android.support:support-v4:27.1.0'
    compile 'com.android.support:cardview-v7:27.1.0'
    compile 'com.android.support:recyclerview-v7:27.1.0'
    compile 'com.android.support:design:27.1.0'

    compile 'com.facebook.android:facebook-android-sdk:4.31.0'
    compile 'it.sephiroth.android.library.imagezoom:imagezoom:2.2.2'
    compile 'com.zendesk:sdk:1.5.1.2'
    compile 'com.amulyakhare:com.amulyakhare.textdrawable:1.0.1'
    compile 'com.splitwise:tokenautocomplete:2.0.1@aar'
    compile 'com.github.bumptech.glide:glide:3.7.0'
    compile 'io.branch.sdk.android:library:1.10.8'
    compile 'com.squareup:android-times-square:1.6.5@aar'
    compile('com.crashlytics.sdk.android:crashlytics:2.5.5@aar') {
        transitive = true;
    }
    compile files('libs/YouTubeAndroidPlayerApi.jar')
    compile files('libs/GoogleConversionTrackingSdk-2.2.4.jar')
    compile 'com.gu.android:toolargetool:0.1.2@aar'
    compile 'jp.wasabeef:blurry:2.1.1'
}

apply plugin: 'com.google.gms.google-services'
